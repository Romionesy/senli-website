<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>聯絡我們 — SENLI 森璃</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { width: 100%; overflow: hidden; background: #dbd7bc; }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 44px;
      background: rgba(245, 242, 228, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo { height: 44px; width: auto; }
    .logo-name {
      font-family: 'Castellar', 'Trajan Pro', 'Times New Roman', serif;
      font-size: 19px; color: #837847; letter-spacing: 0.14em;
      font-weight: normal; line-height: 1;
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a {
      text-decoration: none; color: #837847;
      font-size: 15px; font-weight: 300; letter-spacing: 0.06em;
      font-family: 'Source Han Serif VF', 'Source Han Serif TC', '思源宋體', serif;
      position: relative; transition: opacity 0.35s ease;
    }
    nav a::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px; background: #837847;
      transition: width 0.35s ease;
    }
    nav a:hover { opacity: 0.65; }
    nav a:hover::after, nav a.active::after { width: 100%; }

    /* ══════════════════════════════════════════════════
       PAGE CANVAS  master: 2395.22 × 1260
       padding-bottom = 1260/2395.22 × 100% = 52.60%
       All layers positioned as % of canvas dimensions.
    ══════════════════════════════════════════════════ */
    main { width: 100%; }
    .page {
      position: relative;
      width: 100%;
      padding-bottom: 52.60%;
      height: 0;
      overflow: hidden;
    }

    /* Shared layer style */
    .lyr {
      position: absolute;
      pointer-events: none;
    }
    .lyr img { display: block; width: 100%; height: auto; }

    /* ─── 背景 ─── 直接放大原圖、固定全螢幕、最底層（單張圖、無拼接）*/
    .bg {
      position: fixed; inset: 0; z-index: -1;
      width: auto; height: auto;
      overflow: hidden;
    }
    .bg img {
      position: absolute; top: 50%; left: 50%;
      width: 255%; height: 255%;
      transform: translate(-50%, -50%);
      object-fit: cover; object-position: center;
    }

    /* ─── 線條 ─── 外擴 */
    .lines {
      z-index: 2;
      left: -12%; top: 0%; width: 124%;
      animation: linesFlow 50s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes linesFlow {
      0%   { transform: translate(0%,    0%);    }
      20%  { transform: translate(-1.2%, -0.4%); }
      40%  { transform: translate(-2.1%,  0.3%); }
      60%  { transform: translate(-1.6%,  0.7%); }
      80%  { transform: translate(-0.7%,  0.1%); }
      100% { transform: translate(0%,    0%);    }
    }

    /* ─── 光暈 ─── 外擴 */
    .orb {
      z-index: 3;
      left: 2%; top: 6%; width: 96%;
      animation: orbFloat 10s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes orbFloat {
      0%   { transform: translateY(0px);  }
      50%  { transform: translateY(-8px); }
      100% { transform: translateY(0px);  }
    }

    /* ─── 酒瓶 ─── 往回移，左右各溢出約 2% */
    .bottles { z-index: 4; left: -2%; top: 10%; width: 104%; }

    /* ─── 標題（頁面大標 + 副標） ───
       SVG: 795.58×171.84, master origin (855.28, 343.38)
       Cross-verified: 聯絡我們 in SVG at (259.89,61.18) → master (1115.17,404.56) ✓
       left=855.28/2395.22=35.71%, top=343.38/1260=27.25%, width=795.58/2395.22=33.21% */
    .ctitle { z-index: 5; left: 33.26%; top: 27.25%; width: 33.21%; }

    /* ─── 左側分區方框 ───
       SVG: 380.09×488.48, master origin (593.12, 551.67)
       left=593.12/2395.22=24.76%, top=551.67/1260=43.78%, width=380.09/2395.22=15.87% */
    .info-bg { z-index: 6; left: 22.31%; top: 43.78%; width: 15.87%; }

    /* ─── 左側內文 ───
       SVG: 253.99×366.48, master origin (646.68, 614.24)
       Cross-verified: first text in SVG at (0,16.27) → master (646.68,630.51) ✓
       left=646.68/2395.22=27.00%, top=614.24/1260=48.75%, width=253.99/2395.22=10.60% */
    .info-text { z-index: 7; left: 24.55%; top: 48.75%; width: 10.60%; }

    /* ─── 對話框背景（視覺盒子） ───
       SVG: 417.1×488, master origin (1048.28, 552.62)
       left=43.77%, top=43.86%, width=17.41% */
    .dialog-bg { z-index: 8; left: 41.32%; top: 43.86%; width: 17.41%; }

    /* ─── 對話框的字（靜態文字層，完全來自原設計 SVG） ───
       SVG: 385.61×469.65, master origin (1066.41, 570.57)
       Cross-verified: 向SENLI in SVG at (0,16.27) → master (1066.41,586.84) ✓
       left=1066.41/2395.22=44.52%, top=570.57/1260=45.28%, width=385.61/2395.22=16.10% */
    .dialog-text { z-index: 9; left: 42.07%; top: 45.28%; width: 16.10%; }

    /* ─── 回覆框背景（視覺盒子） ───
       SVG: 380.09×488.48, master origin (1540.44, 551.67)
       left=64.32%, top=43.78%, width=15.87% */
    .reply-bg { z-index: 8; left: 61.87%; top: 43.78%; width: 15.87%; }

    /* ══════════════════════════════════════════════════
       光暈互動熱區（與 product 頁相同效果）
    ══════════════════════════════════════════════════ */
    /* 熱區容器完全疊合光暈圖（與 .orb 同 left/top/width，
       並用 aspect-ratio 1805/998 對齊光暈 SVG 的內部座標系） */
    .orb-hot-wrap {
      position: absolute;
      left: 2%; top: 6%; width: 96%;
      aspect-ratio: 1805 / 998;
      pointer-events: none; z-index: 3;
      animation: orbFloat 10s ease-in-out infinite; /* 與光暈圖同步浮動 */
      will-change: transform;
    }
    .orb-hot {
      position: absolute;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      pointer-events: all;
      cursor: default;
      will-change: transform;
    }
    .orb-hot::after {
      content: '';
      position: absolute; inset: -18%; border-radius: 50%;
      background: radial-gradient(circle,
        rgba(232, 224, 175, 0.38) 0%,
        rgba(196, 215, 148, 0.20) 42%,
        transparent 68%
      );
      mix-blend-mode: screen;
      opacity: 0; transform: scale(0.82);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    @keyframes cOrbFlickerMove {
      0%   { transform: scale(1.00) translateY(0);    }
      18%  { transform: scale(1.10) translateY(-4px); }
      35%  { transform: scale(1.04) translateY(-1px); }
      52%  { transform: scale(1.09) translateY(-3px); }
      70%  { transform: scale(1.02) translateY(0);    }
      85%  { transform: scale(1.07) translateY(-3px); }
      100% { transform: scale(1.00) translateY(0);    }
    }
    @keyframes cOrbFlickerGlow {
      0%   { transform: scale(1.00); opacity: 0.78; }
      18%  { transform: scale(1.18); opacity: 1.00; }
      35%  { transform: scale(1.07); opacity: 0.72; }
      52%  { transform: scale(1.15); opacity: 0.95; }
      70%  { transform: scale(1.04); opacity: 0.70; }
      85%  { transform: scale(1.12); opacity: 0.90; }
      100% { transform: scale(1.00); opacity: 0.78; }
    }
    .orb-hot:hover { animation: cOrbFlickerMove 1.6s ease-in-out infinite !important; }
    .orb-hot:hover::after {
      opacity: 1;
      animation: cOrbFlickerGlow 1.6s ease-in-out infinite;
    }
    /* 各光暈位置：以光暈 SVG 內部座標系 (1805×998) 換算的 %
       資料來自 光暈.svg 內嵌圖片：
       orb1 (0,52,235) / orb2 (182,88,314) / orb3 (1496,0,309) / orb4 (289,739,258) */
    #corb-1 { left:  0.00%; top:  5.21%; width: 13.02%; }
    #corb-2 { left: 10.08%; top:  8.82%; width: 17.40%; }
    #corb-3 { left: 82.88%; top:  0.00%; width: 17.12%; }
    #corb-4 { left: 16.01%; top: 74.05%; width: 14.29%; }

    /* ══════════════════════════════════════════════════
       互動對話框 —— 只保留輸入列 HTML（視覺內容完全來自 SVG 層）
       對話框.svg: 417.1×488
       Input bar starts at y=433.41 within 488-unit dialog SVG:
         top  = 43.86% + (433.41/488) × 38.73% = 43.86% + 34.41% = 78.27% of page height
         height = (53.11/488) × 38.73%            = 4.22%  of page height
    ══════════════════════════════════════════════════ */
    /* 精確對齊對話框輸入列：
       對話框 SVG 高 = 17.41%×(488/417.1)/52.60% = 38.73% 頁高
       輸入列 y=433.41/488 → top = 43.86% + 0.8881×38.73% = 78.26%
       輸入列高 = (53.11/488)×38.73% = 4.21%
       為對齊外框圓角，左右各內縮 0.45% */
    .chat-input-only {
      position: absolute;
      z-index: 10;
      left: 41.77%; top: 78.26%;
      width: 16.51%; height: 4.21%;
      /* 註：left 已配合整體置中左移 2.45%（41.77 = 44.22 − 2.45） */
      display: flex; align-items: center; justify-content: space-between;
      /* 注意：% padding 會以 .page 寬度計算（非元素自身），故改用 vw 單位 */
      padding: 0 0.7vw; gap: 0.5vw;
      /* 不透明背景：覆蓋 SVG 內建的「請輸入訊息......」與送出箭頭，避免重複 */
      background: #e9e4e8;
      pointer-events: all;
      border-radius: 0 0 0.5vw 0.5vw;
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none; outline: none;
      font-family: 'Source Han Serif VF', '思源宋體', serif;
      font-size: 0.62vw; color: #5a5030; letter-spacing: 0.03em;
    }
    #chat-input::placeholder { color: rgba(90, 80, 48, 0.40); }
    #chat-send {
      background: none; border: none; cursor: pointer;
      color: #837847; font-size: 0.85vw;
      width: 1.6vw; height: 1.6vw;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: background 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }
    #chat-send:hover { background: rgba(131,120,71,0.14); transform: scale(1.14); }
    #chat-send:active { transform: scale(0.90); }

    /* ══════════════════════════════════════════════════
       回覆框 Overlay
       回覆框.svg: 380.09×488.48
       height% = 15.87% × (488.48/380.09) / 52.60% = 38.78%
    ══════════════════════════════════════════════════ */
    .reply-overlay {
      position: absolute;
      z-index: 9;
      left: 61.87%; top: 43.78%;
      width: 15.87%; height: 38.78%;
      pointer-events: none;
      display: flex; flex-direction: column;
      overflow: hidden;
      border-radius: 0.6vw;
      /* % padding 會以 .page 寬度計算，故改用 vw 單位避免內容被壓成 0 寬 */
      padding: 1.3vw 1.4vw 1.1vw;
    }
    .reply-messages {
      flex: 1;
      width: 100%; min-width: 0;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.6vw;
      scrollbar-width: thin;
      scrollbar-color: rgba(131, 120, 71, 0.28) transparent;
      pointer-events: auto; /* 允許捲動與刪除操作 */
    }
    .reply-messages::-webkit-scrollbar { width: 3px; }
    .reply-messages::-webkit-scrollbar-track { background: transparent; }
    .reply-messages::-webkit-scrollbar-thumb {
      background: rgba(131, 120, 71, 0.28); border-radius: 2px;
    }

    /* 回覆框裡的訊息：樣式比照你畫的泡泡（#cdba93 @0.5、圓角、右下小尾巴） */
    .msg-reply {
      position: relative;
      background: rgba(205, 186, 147, 0.50);
      border-radius: 14px 14px 14px 4px;
      padding: 0.55vw 0.75vw;
      font-family: 'Source Han Serif VF', '思源宋體', serif;
      font-size: 0.72vw; color: #5a5030; line-height: 1.6;
      align-self: flex-end; width: fit-content; max-width: 100%;
      word-break: break-word;
      animation: msgPop 0.40s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    /* 泡泡右下尾巴（對應你畫的對話框造型） */
    .msg-reply::after {
      content: '';
      position: absolute;
      right: 14%; bottom: -7px;
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-top: 9px solid rgba(205, 186, 147, 0.50);
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(6px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    /* 頁面還原的舊訊息：不播動畫 */
    .msg-no-anim { animation: none; }

    /* ── 每則訊息的刪除鈕（預設隱藏，僅管理模式顯示）── */
    .msg-del {
      position: absolute;
      top: -6px; right: -6px;
      width: 1.05vw; height: 1.05vw; min-width: 16px; min-height: 16px;
      border: none; border-radius: 50%;
      background: #b14b3a; color: #fff;
      font-size: 0.62vw; line-height: 1;
      cursor: pointer;
      display: none; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, background 0.2s ease;
      pointer-events: auto;
    }
    .msg-del:hover { background: #c95a47; transform: scale(1.15); }
    /* 管理模式啟用時才顯示刪除鈕 */
    .reply-messages.admin .msg-del { display: flex; }

    /* ── 管理模式切換鈕（回覆框右上角小鎖）── */
    .owner-toggle {
      position: absolute;
      z-index: 11;
      left: 62.7%; top: 44.7%;
      width: 1.5vw; height: 1.5vw;
      border: none; border-radius: 50%;
      background: rgba(131, 120, 71, 0.16);
      color: #837847; cursor: pointer;
      font-size: 0.8vw; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      pointer-events: all;
      transition: background 0.2s ease, transform 0.15s ease;
      opacity: 0.45;
    }
    .owner-toggle:hover { background: rgba(131,120,71,0.30); opacity: 1; transform: scale(1.1); }
    .owner-toggle.active {
      background: #837847; color: #f5f2e4; opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="logo-wrap">
      <img class="logo" src="assets/logo.svg" alt="">
      <span class="logo-name">SENLI</span>
    </div>
    <nav>
      <a href="index.html">首頁</a>
      <a href="product.html">產品介紹</a>
      <a href="contact.html" class="active">聯絡我們</a>
    </nav>
  </header>

  <main>
    <div class="page">

      <!-- 背景 -->
      <div class="lyr bg">
        <img src="svg檔(聯絡我們)/背景.svg" alt="">
      </div>

      <!-- 線條（緩慢流動） -->
      <div class="lyr lines">
        <img src="svg檔(聯絡我們)/線條.svg" alt="">
      </div>

      <!-- 光暈（輕柔浮動） -->
      <div class="lyr orb">
        <img src="svg檔(聯絡我們)/光暈.svg" alt="">
      </div>

      <!-- 酒瓶 -->
      <div class="lyr bottles">
        <img src="svg檔(聯絡我們)/酒瓶.svg" alt="">
      </div>

      <!-- 標題 -->
      <div class="lyr ctitle">
        <img src="svg檔(聯絡我們)/標題.svg" alt="聯絡我們">
      </div>

      <!-- 左側資訊欄（方框 + 內文） -->
      <div class="lyr info-bg">
        <img src="svg檔(聯絡我們)/分區方框.svg" alt="">
      </div>
      <div class="lyr info-text">
        <img src="svg檔(聯絡我們)/內文.svg" alt="">
      </div>

      <!-- 對話框背景 SVG（z-index 8） -->
      <div class="lyr dialog-bg">
        <img src="svg檔(聯絡我們)/對話框.svg" alt="">
      </div>

      <!-- 對話框的字 SVG（z-index 9）：原設計完整 header＋訊息＋placeholder -->
      <div class="lyr dialog-text">
        <img src="svg檔(聯絡我們)/對話框的字.svg" alt="">
      </div>

      <!-- 對話框輸入列（z-index 10，不透明覆蓋 SVG 輸入區，避免文字/箭頭重複） -->
      <div class="chat-input-only">
        <input type="text" id="chat-input" placeholder="請輸入訊息……">
        <button id="chat-send" title="送出">&#9654;</button>
      </div>

      <!-- 回覆框背景 SVG（只留外框，泡泡由動態訊息呈現） -->
      <div class="lyr reply-bg">
        <img src="svg檔(聯絡我們)/回覆框_外框.svg" alt="">
      </div>

      <!-- 回覆框累積顯示 Overlay -->
      <div class="reply-overlay" id="reply-overlay">
        <div class="reply-messages" id="reply-messages"></div>
      </div>

      <!-- 管理模式切換鈕（密碼保護，只有擁有者能啟用刪除） -->
      <button class="owner-toggle" id="owner-toggle" title="管理模式">&#128274;</button>

      <!-- 光暈互動熱區 -->
      <div class="orb-hot-wrap">
        <div class="orb-hot" id="corb-1"></div>
        <div class="orb-hot" id="corb-2"></div>
        <div class="orb-hot" id="corb-3"></div>
        <div class="orb-hot" id="corb-4"></div>
      </div>

    </div>
  </main>

  <script>
  /* ── 對話框互動 + localStorage 持久化 + 管理員刪除 ── */
  (function () {
    var STORAGE_KEY = 'senli_reply_messages';
    var ADMIN_KEY   = 'senli_admin_unlocked';
    /* 擁有者密碼（僅你知道；前端密碼閘門，可擋一般訪客） */
    var OWNER_PASSWORD = 'Rosy17';

    var chatInput   = document.getElementById('chat-input');
    var chatSend    = document.getElementById('chat-send');
    var replyMsgs   = document.getElementById('reply-messages');
    var ownerToggle = document.getElementById('owner-toggle');

    /* 訊息資料來源（陣列，含唯一 id） */
    var messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    /* 相容舊格式（純字串陣列）→ 轉成物件 */
    messages = messages.map(function (m, i) {
      if (typeof m === 'string') return { id: Date.now() + '_' + i, text: m };
      return m;
    });

    var isAdmin = sessionStorage.getItem(ADMIN_KEY) === '1';

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    /* 重新渲染整個回覆框 */
    function render(scrollToEnd) {
      replyMsgs.innerHTML = '';
      messages.forEach(function (m) {
        var div = document.createElement('div');
        div.className = 'msg-reply msg-no-anim';
        div.dataset.id = m.id;

        var span = document.createElement('span');
        span.textContent = m.text;
        div.appendChild(span);

        /* 刪除鈕（僅管理模式顯示，由 CSS .admin 控制） */
        var del = document.createElement('button');
        del.className = 'msg-del';
        del.innerHTML = '&times;';
        del.title = '刪除這則訊息';
        del.addEventListener('click', function () {
          messages = messages.filter(function (x) { return x.id !== m.id; });
          save();
          render(false);
        });
        div.appendChild(del);

        replyMsgs.appendChild(div);
      });
      replyMsgs.classList.toggle('admin', isAdmin);
      if (scrollToEnd) replyMsgs.scrollTop = replyMsgs.scrollHeight;
    }

    /* 初次載入 */
    render(true);

    /* 送出新訊息 */
    function sendMessage() {
      var text = chatInput.value.trim();
      if (!text) return;
      messages.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), text: text });
      save();
      render(true);
      /* 為最後一則加上彈出動畫 */
      var last = replyMsgs.lastElementChild;
      if (last) { last.classList.remove('msg-no-anim'); }
      chatInput.value = '';
      chatInput.focus();
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') sendMessage();
    });

    /* ── 管理模式切換（密碼保護）── */
    function updateToggleUI() {
      ownerToggle.classList.toggle('active', isAdmin);
      ownerToggle.innerHTML = isAdmin ? '&#128275;' : '&#128274;'; /* 開鎖/上鎖 */
      ownerToggle.title = isAdmin ? '管理模式（已啟用，點擊關閉）' : '管理模式（需密碼）';
    }
    updateToggleUI();

    ownerToggle.addEventListener('click', function () {
      if (isAdmin) {
        /* 已是管理員 → 關閉管理模式 */
        isAdmin = false;
        sessionStorage.removeItem(ADMIN_KEY);
      } else {
        /* 要求輸入密碼 */
        var pw = prompt('請輸入管理密碼以啟用刪除功能：');
        if (pw === null) return;
        if (pw === OWNER_PASSWORD) {
          isAdmin = true;
          sessionStorage.setItem(ADMIN_KEY, '1');
        } else {
          alert('密碼錯誤');
          return;
        }
      }
      updateToggleUI();
      render(false);
    });
  })();
  </script>

</body>
</html>
