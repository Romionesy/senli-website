<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>產品介紹 — SENLI 森璃</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { width: 100%; overflow-x: hidden; background: #e4e0c6; }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 44px;
      background: rgba(245, 242, 228, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo { height: 44px; width: auto; }
    .logo-name {
      font-family: 'Castellar', 'Trajan Pro', 'Times New Roman', serif;
      font-size: 19px; color: #837847; letter-spacing: 0.14em;
      font-weight: normal; line-height: 1;
    }
    nav { display: flex; align-items: center; gap: 36px; }
    nav a {
      text-decoration: none; color: #837847;
      font-size: 15px; font-weight: 300;
      letter-spacing: 0.06em;
      font-family: 'Source Han Serif VF', 'Source Han Serif TC', '思源宋體', serif;
      position: relative; transition: opacity 0.35s ease;
    }
    nav a::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px; background: #837847;
      transition: width 0.35s ease;
    }
    nav a:hover { opacity: 0.65; }
    nav a:hover::after, nav a.active::after { width: 100%; }

    /* ══════════════════════════════════════════════════
       PAGE CANVAS
       Master canvas: 2545.8 × 3679.88
       padding-bottom = 3679.88/2545.8 × 100% = 144.54%
       All layers use % of this canvas as coordinates.
    ══════════════════════════════════════════════════ */
    .page {
      position: relative;
      width: 100%;
      padding-bottom: 144.54%;
      overflow: hidden;
    }

    /* All layers share absolute positioning; img fills its container width */
    .lyr {
      position: absolute;
      pointer-events: none;
    }
    .lyr img { display: block; width: 100%; height: auto; }

    /* ─── 背景 (background) ───
       Expanded to fill full canvas width + 外擴 overflow */
    .bg { z-index: 1; left: -5%; top: -2%; width: 110%; }

    /* ─── 線條 (flow lines, animated) ───
       ViewBox: 2545.8 × 3578.68  — same width as canvas
       外擴: expanded by ~18% each side */
    .lines {
      z-index: 2;
      left: -18%; top: 0%; width: 136%;
      animation: linesFlow 50s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes linesFlow {
      0%   { transform: translate(0%,    0%);    }
      20%  { transform: translate(-1.2%, -0.4%); }
      40%  { transform: translate(-2.1%,  0.3%); }
      60%  { transform: translate(-1.6%,  0.7%); }
      80%  { transform: translate(-0.7%,  0.1%); }
      100% { transform: translate(0%,    0%);    }
    }

    /* ─── 光暈 (orb glow) ───
       ViewBox: 2044×2655
       外擴: left=0%, width=106% 使光暈充分蓋住左右兩側 */
    .orb {
      z-index: 3;
      left: 0%; top: 0%; width: 106%;
      animation: orbFloat 10s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes orbFloat {
      0%   { transform: translateY(0px);   }
      50%  { transform: translateY(-8px);  }
      100% { transform: translateY(0px);   }
    }

    /* ── 光暈互動熱區 ──
       光暈.svg viewBox: 2044×2655，rendered at left:0%, width:106%
       換算：水平 1px = 106/2044 = 0.05186% 頁寬；垂直 1px = 95.27/2655 = 0.03589% 頁高
       各顆光暈內部座標（translate x, y）→ 轉成 .page 的 left/top/width */
    .orb-hot-wrap {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 3;
    }
    .orb-hot {
      position: absolute;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      pointer-events: all;
      cursor: default;
      will-change: transform;
    }
    /* hover 時出現的發光暈層 */
    .orb-hot::after {
      content: '';
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(232, 224, 175, 0.38) 0%,
        rgba(196, 215, 148, 0.20) 42%,
        transparent 68%
      );
      mix-blend-mode: screen;
      opacity: 0;
      transform: scale(0.82);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    /* 各顆浮動（無 hover 時） */
    @keyframes pOrbFloat {
      0%   { transform: translateY(0px);   }
      50%  { transform: translateY(-14px); }
      100% { transform: translateY(0px);   }
    }
    /* hover：主體輕微縮放 */
    @keyframes pOrbFlickerMove {
      0%   { transform: scale(1.00) translateY(0);    }
      18%  { transform: scale(1.10) translateY(-4px); }
      35%  { transform: scale(1.04) translateY(-1px); }
      52%  { transform: scale(1.09) translateY(-3px); }
      70%  { transform: scale(1.02) translateY(0);    }
      85%  { transform: scale(1.07) translateY(-3px); }
      100% { transform: scale(1.00) translateY(0);    }
    }
    /* hover：光暈閃爍 */
    @keyframes pOrbFlickerGlow {
      0%   { transform: scale(1.00); opacity: 0.78; }
      18%  { transform: scale(1.18); opacity: 1.00; }
      35%  { transform: scale(1.07); opacity: 0.72; }
      52%  { transform: scale(1.15); opacity: 0.95; }
      70%  { transform: scale(1.04); opacity: 0.70; }
      85%  { transform: scale(1.12); opacity: 0.90; }
      100% { transform: scale(1.00); opacity: 0.78; }
    }
    .orb-hot:hover {
      animation: pOrbFlickerMove 1.6s ease-in-out infinite !important;
    }
    .orb-hot:hover::after {
      opacity: 1;
      animation: pOrbFlickerGlow 1.6s ease-in-out infinite;
    }
    /* 各顆座標與浮動時序 */
    #porb-1 { left:  0.00%; top:  4.41%; width: 18.93%; animation: pOrbFloat 9s ease-in-out 0.0s infinite; }
    #porb-2 { left: 12.76%; top: 10.34%; width: 12.14%; animation: pOrbFloat 9s ease-in-out 1.5s infinite; }
    #porb-3 { left: 74.11%; top:  0.00%; width: 16.02%; animation: pOrbFloat 9s ease-in-out 3.0s infinite; }
    #porb-4 { left: 22.56%; top: 23.94%; width: 13.33%; animation: pOrbFloat 9s ease-in-out 4.5s infinite; }
    #porb-5 { left:  6.59%; top: 77.22%; width: 19.86%; animation: pOrbFloat 9s ease-in-out 6.0s infinite; }
    #porb-6 { left: 92.72%; top: 86.11%; width: 13.28%; animation: pOrbFloat 9s ease-in-out 7.5s infinite; }

    /* ─── 酒瓶 (bottles — both in one SVG) ───
       ViewBox: 2005×2026
       左瓶在 SVG x=0，右瓶右緣在 SVG x=2005
       再各向外擴 5%，確保兩端瓶體完全貼合螢幕左右邊緣 */
    .bottles { z-index: 4; left: -2%; top: 1%; width: 104%; }

    /* ─── 標語 (hero tagline) ───
       ViewBox: 747.15×459.47
       Verified from embedded icon cross-reference (icons at canvas 778,208 / 1016,267 / 1211,209)
       minus their SVG-internal offsets (-3.6,-10.58 / 234.4,48.42 / 429.4,-9.58)
       → SVG origin in master canvas: (781.64, 218.58)
       left  = 781.64 / 2545.8 = 30.70%
       top   = 218.58 / 3679.88 = 5.94%
       width = 747.15 / 2545.8 = 29.36%
       mix-blend-mode: multiply removes white PNG backgrounds */
    .tagline { z-index: 5; left: 30.70%; top: 5.94%; width: 29.36%; mix-blend-mode: multiply; }

    /* ─── 產品圖 (product image) ───
       ViewBox: 1171.99×1152.03
       Exact origin from embedded PNG mapping vs master reference:
       SVG origin: canvas (1169.77, 710.32)
       left  = 1169.77 / 2545.8 = 45.95%
       top   = 710.32  / 3679.88 = 19.30%
       width = 1171.99 / 2545.8 = 46.04% */
    .product { z-index: 6; left: 45.95%; top: 19.30%; width: 46.04%; }

    /* ─── 分區的方框 (card backgrounds) ───
       ViewBox: 1541.2×2021.41
       Verified from master reference rect cross-match:
         master rect x=703.92,y=1222.87 matches SVG rect x=3.48,y=1
         → SVG origin in master = (703.92−3.48, 1222.87−1) = (700.44, 1221.87)
       left  = 700.44 / 2545.8 = 27.51%
       top   = 1221.87 / 3679.88 = 33.20%
       width = 1541.2  / 2545.8 = 60.54% */
    .cards-bg { z-index: 7; left: 27.51%; top: 33.20%; width: 60.54%; }

    /* ─── 內文 (card text content) ───
       ViewBox: 1435.13×1922.75
       Verified from master reference rect cross-match:
         master rect x=756.73,y=1417.8 matches SVG rect x=1,y=150.09
         → SVG origin in master = (756.73−1, 1417.8−150.09) = (755.73, 1267.71)
       left  = 755.73 / 2545.8 = 29.68%
       top   = 1267.71 / 3679.88 = 34.45%
       width = 1435.13 / 2545.8 = 56.39% */
    .cards-text { z-index: 8; left: 29.68%; top: 34.45%; width: 56.39%; }

    /* 照片已嵌入 內文.svg 內部，不需要獨立圖層 */

    /* ══════════════════════════════════════════
       卡片點擊放大功能
    ══════════════════════════════════════════ */

    /* 頁面上的透明可點擊熱區 */
    .card-hot {
      position: absolute;
      border-radius: 12px;
      cursor: zoom-in;
      border: 2px solid transparent;
      background: transparent;
      transition: border-color 0.25s ease, background 0.25s ease;
      z-index: 9;
      pointer-events: all;
    }
    .card-hot:hover {
      border-color: rgba(131, 120, 71, 0.38);
      background: rgba(245, 240, 215, 0.12);
    }
    .card-hot::after {
      content: '點擊放大';
      position: absolute;
      bottom: 7px; right: 11px;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(131, 120, 71, 0.80);
      background: rgba(245, 242, 228, 0.88);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(131, 120, 71, 0.22);
      font-family: 'Source Han Serif VF', '思源宋體', serif;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .card-hot:hover::after { opacity: 1; }

    /* Modal 外層覆蓋 */
    .card-modal {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      visibility: hidden; opacity: 0;
      transition: opacity 0.32s ease, visibility 0.32s ease;
    }
    .card-modal.open { visibility: visible; opacity: 1; }

    /* 背景模糊遮罩 */
    .card-modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(38, 34, 20, 0.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    /* 視窗本體 */
    .card-modal-box {
      position: relative; z-index: 1;
      width: min(90vw, 1080px);
      height: min(88vh, 860px);
      background: #f5f2e4;
      border-radius: 18px;
      box-shadow: 0 28px 90px rgba(0,0,0,0.40);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .card-modal.open .card-modal-box {
      animation: modalSlideIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes modalSlideIn {
      from { transform: scale(0.86) translateY(24px); opacity: 0; }
      to   { transform: scale(1)    translateY(0);    opacity: 1; }
    }

    /* 標題列 */
    .card-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px 13px;
      border-bottom: 1px solid rgba(131, 120, 71, 0.18);
      flex-shrink: 0;
      background: rgba(245, 242, 228, 0.96);
    }
    .card-modal-title {
      font-family: 'Source Han Serif VF', 'Source Han Serif TC', '思源宋體', serif;
      font-size: 16px; color: #5a5030;
      letter-spacing: 0.10em; font-weight: normal;
    }
    .card-modal-close {
      width: 32px; height: 32px;
      border: none; background: none; cursor: pointer;
      color: #837847; font-size: 18px; line-height: 1;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease; flex-shrink: 0;
    }
    .card-modal-close:hover { background: rgba(131, 120, 71, 0.14); }

    /* 視口：裁切顯示，用 transform 而非捲動定位 */
    .card-modal-viewport {
      flex: 1;
      overflow: hidden;
      background: #e8e4ce;
      position: relative;
    }

    /* 畫布：絕對定位，用 JS transform 移到目標卡片 */
    .card-modal-canvas {
      position: absolute;
      top: 0; left: 0;
      will-change: transform, width, clip-path;
      transition: transform  0.42s cubic-bezier(0.22, 1, 0.36, 1),
                  width      0.42s cubic-bezier(0.22, 1, 0.36, 1),
                  clip-path  0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-modal-frame-bg {
      display: block;
      width: 100%; height: auto;
    }
    /* 內文.svg 相對於分區方框.svg 的偏移：
       left = 55.29/1541.2 = 3.59%
       top  = 45.84/2021.41 = 2.27%（% of canvas height）
       width= 1435.13/1541.2 = 93.12% */
    .card-modal-frame-text {
      position: absolute;
      left: 3.59%; top: 2.27%;
      width: 93.12%; height: auto;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-wrap">
      <img class="logo" src="assets/logo.svg" alt="">
      <span class="logo-name">SENLI</span>
    </div>
    <nav>
      <a href="index.html">首頁</a>
      <a href="product.html" class="active">產品介紹</a>
      <a href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <div class="page">

      <!-- 背景 -->
      <div class="lyr bg">
        <img src="svg檔(產品介紹)/背景.svg?v=2" alt="">

      <div class="lyr lines">

      <!-- 照片已嵌入 內文.svg 內，不需額外圖層 -->

      <!-- ── 卡片點擊熱區（透明可點擊覆蓋在各方框上）──
           位置計算：cards-bg left=27.51%,top=33.20%,width=60.54%
           各 card 的 left/top/width/height 均為 master canvas 換算後的頁面百分比 -->
      <div class="card-hot" data-card="0"
           style="left:27.65%;top:33.23%;width:36.55%;height:7.30%"></div>
      <div class="card-hot" data-card="1"
           style="left:27.67%;top:42.09%;width:36.55%;height:13.90%"></div>
      <div class="card-hot" data-card="2"
           style="left:66.69%;top:48.67%;width:21.34%;height:7.35%"></div>
      <div class="card-hot" data-card="3"
           style="left:27.67%;top:57.57%;width:36.55%;height:12.85%"></div>
      <div class="card-hot" data-card="4"
           style="left:66.76%;top:57.57%;width:21.20%;height:12.88%"></div>
      <div class="card-hot" data-card="5"
           style="left:27.55%;top:72.01%;width:60.44%;height:16.10%"></div>

    </div>
  </main>

  <!-- ── 卡片放大視窗（Modal）── -->
  <div id="card-modal" class="card-modal">
    <div class="card-modal-backdrop" id="card-modal-backdrop"></div>
    <div class="card-modal-box">
      <div class="card-modal-header">
        <span class="card-modal-title" id="card-modal-title">—</span>

        <div class="card-modal-canvas" id="card-modal-canvas">
          <img class="card-modal-frame-bg"
               src="svg檔(產品介紹)/分區的方框.svg?v=2" alt="">

               src="svg檔(產品介紹)/內文.svg?v=2" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- 卡片放大邏輯（transform 定位，不捲動） -->
  <script>
  (function () {
    /* 六張卡片（分區的方框.svg 1541.2×2021.41 中的正規化座標） */
    var CARDS = [
      { title: '—01　設計主題與動機',
        nx1:   3.48/1541.2, ny1:    1/2021.41,
        nx2: 933.84/1541.2, ny2: 269.62/2021.41 },
      { title: '—02　市場與使用者研究',
        nx1:   4.15/1541.2, ny1:  327.43/2021.41,
        nx2: 934.51/1541.2, ny2:  839.10/2021.41 },
      { title: '—03　設計機會與方向',
        nx1:  996.99/1541.2, ny1:  569.29/2021.41,
        nx2: 1540.19/1541.2, ny2:  839.62/2021.41 },
      { title: '—04　概念發想過程',
        nx1:   4.15/1541.2, ny1:  896.92/2021.41,
        nx2: 934.51/1541.2, ny2: 1369.97/2021.41 },
      { title: '—05　設計提案與特色',
        nx1:  998.58/1541.2, ny1:  896.92/2021.41,
        nx2: 1538.24/1541.2, ny2: 1370.88/2021.41 },
      { title: '—06　使用情境與故事板',
        nx1:    1/1541.2,    ny1: 1428.18/2021.41,
        nx2: 1538.89/1541.2, ny2: 2020.41/2021.41 },
    ];

    var modal    = document.getElementById('card-modal');
    var backdrop = document.getElementById('card-modal-backdrop');
    var titleEl  = document.getElementById('card-modal-title');
    var closeBtn = document.getElementById('card-modal-close');
    var viewport = document.getElementById('card-modal-viewport');
    var canvas   = document.getElementById('card-modal-canvas');

    function openCard(idx) {
      var card = CARDS[idx];
      titleEl.textContent = card.title;

      /* 先把 canvas 移到畫面外，避免閃爍 */
      canvas.style.transition = 'none';
      canvas.style.transform  = 'translate(-9999px, -9999px)';
      canvas.style.width      = '';
      canvas.style.clipPath   = '';

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      /* 等兩幀確保 modal 已渲染，再計算並套用位置 */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          canvas.style.transition = ''; /* 恢復 CSS transition */
          zoomToCard(card);
        });
      });
    }

    function zoomToCard(card) {
      var vpW = viewport.clientWidth;
      var vpH = viewport.clientHeight;

      /* 卡片在 SVG 座標系的尺寸 */
      var cardW_svg = (card.nx2 - card.nx1) * 1541.2;
      var cardH_svg = (card.ny2 - card.ny1) * 2021.41;

      /* 讓卡片填滿視口的 88%，最大 4× */
      var scale = Math.min(
        (vpW * 0.88) / cardW_svg,
        (vpH * 0.88) / cardH_svg,
        4.0
      );
      scale = Math.max(scale, 0.4);

      var canvasW = Math.round(1541.2 * scale);
      var canvasH = canvasW * (2021.41 / 1541.2); /* 維持長寬比 */

      /* 目標卡片中心點（canvas 像素） */
      var cardCx = (card.nx1 + card.nx2) / 2 * canvasW;
      var cardCy = (card.ny1 + card.ny2) / 2 * canvasH;

      /* 平移 canvas，讓卡片中心對齊視口中心 */
      var tx = Math.round(vpW / 2 - cardCx);
      var ty = Math.round(vpH / 2 - cardCy);

      canvas.style.width     = canvasW + 'px';
      canvas.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';

      /* clip-path：精確裁切到目標卡片邊界，完全遮住相鄰方框
         inset(top right bottom left round radius)
         各值為相對於 canvas 自身寬/高的百分比 */
      var r = Math.round(12 * scale); /* 對應 SVG rx/ry="12" 的圓角 */
      canvas.style.clipPath = 'inset('
        + (card.ny1 * 100).toFixed(2) + '% '
        + ((1 - card.nx2) * 100).toFixed(2) + '% '
        + ((1 - card.ny2) * 100).toFixed(2) + '% '
        + (card.nx1 * 100).toFixed(2) + '% '
        + 'round ' + r + 'px)';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      /* 關閉後重設，避免下次開啟時有殘留 */
      setTimeout(function () {
        canvas.style.transform = '';
        canvas.style.width     = '';
        canvas.style.clipPath  = '';
      }, 400);
    }

    document.querySelectorAll('.card-hot').forEach(function (el) {
      el.addEventListener('click', function () {
        openCard(parseInt(el.dataset.card, 10));
      });
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  })();
  </script>

</body>
</html>
